<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CringleAI | GPT-Powered Business Agents</title>
  <meta name="description" content="CringleAI builds premium GPT-powered AI agents for small businesses, creators, automation, cybersecurity, cloud systems, marketing, and digital growth." />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: radial-gradient(circle at top, rgba(255,165,0,0.22), transparent 35%), linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.98)), #070707;
      overflow-x: hidden;
    }
    .chat-shell,.feature-box,.hero {
      max-width: 1100px;
      margin: auto;
      background: rgba(0,0,0,0.76);
      border: 1px solid rgba(255,200,90,0.34);
      border-radius: 30px;
      padding: 40px;
    }
    .chat-window {
      height: 360px;
      overflow-y: auto;
      text-align: left;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 18px;
    }
    .chat-message { margin: 12px 0; padding: 14px 16px; border-radius: 16px; }
    .user-message { background: linear-gradient(135deg,#ff8a00,#f5c45b); color:#000; }
    .ai-message { background: rgba(255,255,255,0.08); color:#fff; }
    input, textarea {
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,200,90,0.3);
      background: rgba(255,255,255,0.05);
      color: white;
      width: 100%;
      margin: 8px 0;
    }
    button {
      background: linear-gradient(135deg,#ff8a00,#f5c45b);
      color:#000;
      padding:16px 28px;
      border:none;
      border-radius:999px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="hero">
    <h1>Meet CringleAI</h1>

    <!-- Access Gate -->
    <div class="chat-shell" id="agentGate">
      <div class="chat-window">
        <div class="chat-message ai-message">
          Before using CringleAI, please enter your full name, birthday, and email address to continue.
        </div>
      </div>

      <form id="gateForm" onsubmit="unlockAgent(event)">
        <input id="fullName" type="text" placeholder="Full Name" required>
        <input id="birthDate" type="date" required>
        <input id="emailAddress" type="email" placeholder="Email Address" required>
        <button type="submit">Unlock CringleAI</button>
      </form>
    </div>

    <!-- Main AI Chat -->
    <div class="chat-shell" id="ai" style="display:none;">
      <div id="chatWindow" class="chat-window">
        <div class="chat-message ai-message">
          Welcome to CringleAI. Ask me about AI automation, websites, cybersecurity, cloud systems, marketing, or business growth.
        </div>
      </div>

      <div>
        <input id="chatInput" type="text" placeholder="Ask CringleAI anything..." />
        <button id="chatButton" type="button" onclick="sendCringleMessage()">Send</button>
      </div>

      <div id="chatStatus"></div>
    </div>
  </div>
</header>

<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CRINGLE_WORKER_URL = "https://cringleai-api.chrispcringle.workers.dev/";

// SUPABASE CONFIG (replace with your real project values)
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let cringleHistory = JSON.parse(localStorage.getItem("cringleAIHistory")) || [];
let cringleUserProfile = JSON.parse(localStorage.getItem("cringleUserProfile")) || null;

function unlockAgent(event) {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const birthDate = document.getElementById("birthDate").value;
  const emailAddress = document.getElementById("emailAddress").value.trim();

  cringleUserProfile = { fullName, birthDate, emailAddress, unlockedAt: new Date().toISOString() };
  localStorage.setItem("cringleUserProfile", JSON.stringify(cringleUserProfile));

  // Save lead into Supabase
  saveLeadToSupabase(cringleUserProfile);

  document.getElementById("agentGate").style.display = "none";
  document.getElementById("ai").style.display = "block";
}

async function saveLeadToSupabase(userProfile) {
  try {
    const { error } = await supabaseClient
      .from("cringle_leads")
      .insert([
        {
          full_name: userProfile.fullName,
          birth_date: userProfile.birthDate,
          email: userProfile.emailAddress,
          created_at: new Date().toISOString()
        }
      ]);

    if (error) {
      console.error("Supabase insert error:", error.message);
    }
  } catch (err) {
    console.error("Supabase connection error:", err);
  }
}

function addMessage(text, sender) {
  const chatWindow = document.getElementById("chatWindow");
  const messageDiv = document.createElement("div");
  messageDiv.className = `chat-message ${sender === "user" ? "user-message" : "ai-message"}`;
  messageDiv.innerText = text;
  chatWindow.appendChild(messageDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendCringleMessage() {
  const input = document.getElementById("chatInput");
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const response = await fetch(CRINGLE_WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      history: cringleHistory,
      user: cringleUserProfile
    })
  });

  const data = await response.json();
  const aiReply = data.output_text || data.choices?.[0]?.message?.content || "No response returned.";
  addMessage(aiReply, "ai");
}

document.addEventListener("DOMContentLoaded", () => {
  if (cringleUserProfile) {
    document.getElementById("agentGate").style.display = "none";
    document.getElementById("ai").style.display = "block";
  }

  document.getElementById("chatInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendCringleMessage();
  });
});
</script>

</body>
</html>
